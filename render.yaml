# API (api/server.js) no Render — o front fica no GitHub Pages.
# No Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: zerotomei-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/planos
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
