<!doctype html>
<html lang="pt-BR">
  <head>
    <script src="../../../shared/scripts/api.js" data-protegida></script>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financeiro</title>
    <link rel="stylesheet" href="../../../shared/components/FinanceiroNavBar/style.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../../shared/components/NavBarGlobal/style.css" />
    <link rel="stylesheet" href="../../../shared/styles/transicoes.css" />
    <link rel="stylesheet" href="../../../shared/components/Menu/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Financeiro</h1>
        <div class="filter-icon" role="button" tabindex="0" data-abrir-menu aria-label="Abrir menu">
          <img src="../Assets/Filter.svg" alt="Filtro" />
        </div>
      </div>

      <div id="navbar"></div>

      <div class="card-saldo">
        <p class="card-saldo-label">Saldo disponível</p>
        <div class="card-saldo-row">
          <p class="card-saldo-valor">R$: 0,00</p>
          <span class="icon-edit"><img src="../Assets/Edit 2.png" /></span>
        </div>
      </div>

      <div class="cards-duplos">
        <div class="card-mini">
          <p class="card-mini-label">Contas a pagar</p>
          <div class="card-mini-row">
            <p class="card-mini-valor vermelho">R$: 0,00</p>
            <span class="icon-edit-mini"
              ><img src="../Assets/Edit 3.png" />
            </span>
          </div>
        </div>
        <div class="card-mini">
          <p class="card-mini-label">Contas a receber</p>
          <div class="card-mini-row">
            <p class="card-mini-valor verde">R$: 0,00</p>
            <span class="icon-edit-mini"
              ><img src="../Assets/Edit 3.png"
            /></span>
          </div>
        </div>
      </div>

      <p class="section-title">Despesas:</p>

      <div class="cards-despesas">
        <div class="card-despesa">
          <p class="card-despesa-texto">Indisponível</p>
        </div>
        <div class="card-despesa">
          <p class="card-despesa-texto">Indisponível</p>
        </div>
        <div class="card-despesa">
          <p class="card-despesa-texto">Indisponível</p>
        </div>
      </div>

      <div class="exemplo-header">
        <p class="section-title">Exemplo:</p>
        <span class="ver-mais">Ver mais</span>
      </div>

      <div class="card-exemplo">
        <div class="card-exemplo-esquerda">
          <span class="seta-cima">↑</span>
          <p class="card-exemplo-nome">Uber do brasil Ltda</p>
        </div>
        <div class="card-exemplo-direita">
          <p class="card-exemplo-valor">-R$ 120,00</p>
          <span class="icon-lixo"><img src="../Assets/Trash.svg" /> </span>
        </div>
      </div>
    </div>

    <script src="../../../shared/components/FinanceiroNavBar/script.js"></script>

    <!-- Navbar global (rodapé) -->
    <div id="navbar-global"></div>
    <script src="../../../shared/components/NavBarGlobal/script.js"></script>

    <!-- Menu lateral (abre pelo ícone de filtro) -->
    <script src="../../../shared/components/Menu/script.js"></script>
  </body>
</html>
