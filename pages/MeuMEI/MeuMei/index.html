<!DOCTYPE html>
<html lang="pt-br">

<head>
    <script src="../../../shared/scripts/api.js" data-protegida></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../../shared/styles/global.css">
    <link rel="stylesheet" href="../../../shared/components/MeuMeiNavBar/style.css">
    <link rel="stylesheet" href="./style.css">
    <title>Meu MEI</title>
  <link rel="stylesheet" href="../../../shared/components/NavBarGlobal/style.css" />
  <link rel="stylesheet" href="../../../shared/styles/transicoes.css" />
  <link rel="stylesheet" href="../../../shared/components/Menu/style.css" />
</head>

<body>
    <main class="meu-mei">
        <div id="navbar"></div>

        <section class="negocio">
            <div class="negocio__avatar">
                <img src="../Assets/Loja.svg" alt="">
            </div>

            <div class="negocio__dados">
                <h2>Meu negócio</h2>

                <p id="negocio-dono">Carregando...</p>
                <p id="negocio-cnpj">CNPJ: —</p>
                <p class="negocio__situacao">Situação: <span id="negocio-situacao">—</span></p>
            </div>

            <button type="button" class="negocio__acao" id="btn-editar-negocio">Ver informações</button>
        </section>

        <section class="obrigacoes">
            <header class="secao">
                <h2>Suas obrigações</h2>

                <a href="../Obrigações/index.html">Ver todos</a>
            </header>

            <div class="obrigacoes__lista" id="lista-obrigacoes">
                <p id="obrigacoes-carregando">Carregando obrigações...</p>
            </div>
        </section>

        <section class="guia">
            <h2>Guia do MEI</h2>

            <div class="guia__grade">
                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Predio.svg" alt="">

                    <span>Como abrir um MEI</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Recibo.svg" alt="">

                    <span>Como emitir o DAS</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Martelo.svg" alt="">

                    <span>Direitos e obrigações</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Documentos.svg" alt="">

                    <span>Documentos importantes</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Calendario.svg" alt="">

                    <span>Declaração anual</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Lupa.svg" alt="">

                    <span>Dúvidas frequentes</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>
            </div>
        </section>
    </main>

    <!-- Janela para editar os dados do negócio (aberta pelo botão "Ver informações") -->
    <div class="modal-overlay" id="modal-negocio" hidden>
        <div class="modal-negocio" role="dialog" aria-modal="true" aria-labelledby="modal-negocio-titulo">
            <div class="modal-negocio__topo">
                <h2 id="modal-negocio-titulo">Meu negócio</h2>
                <button type="button" class="modal-negocio__fechar" id="btn-fechar-negocio" aria-label="Fechar">&times;</button>
            </div>

            <form id="form-negocio" novalidate>
                <label class="modal-negocio__campo">
                    Nome do negócio
                    <input type="text" name="nome_negocio" id="campo-nome-negocio" maxlength="80" placeholder="Ex.: MercaFácil" required />
                </label>

                <label class="modal-negocio__campo">
                    CNPJ
                    <input type="text" name="cnpj" id="campo-cnpj" maxlength="18" placeholder="00.000.000/0001-00" required />
                </label>

                <label class="modal-negocio__campo">
                    Situação
                    <input type="text" name="situacao" id="campo-situacao" maxlength="40" placeholder="Ex.: Mei Ativo" required />
                </label>

                <p class="modal-negocio__mensagem" id="modal-negocio-mensagem" role="status"></p>

                <div class="modal-negocio__acoes">
                    <button type="button" class="modal-negocio__cancelar" id="btn-cancelar-negocio">Cancelar</button>
                    <button type="submit" class="modal-negocio__salvar" id="btn-salvar-negocio">Salvar</button>
                </div>
            </form>
        </div>
    </div>

  <!-- Navbar global (rodapé) -->
  <div id="navbar-global"></div>
  <script src="../../../shared/components/NavBarGlobal/script.js"></script>

  <!-- Menu lateral (abre pelo ícone de filtro) -->
  <script src="../../../shared/components/Menu/script.js"></script>

  <script src="script.js"></script>
</body>

<script src="../../../shared/components/MeuMeiNavBar/script.js"></script>

</html>
