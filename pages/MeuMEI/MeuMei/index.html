<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

    <link rel="stylesheet" href="../../../shared/styles/reset.css">

<body>
    <main class="meu-mei">
        <div id="navbar"></div>

        <section class="negocio">
            <div class="negocio__avatar">
                <img src="../Assets/Loja.svg" alt="">
            </div>

            <div class="negocio__dados">
                <h2>Meu negócio</h2>

                <p id="negocio-dono">Carregando...</p>
                <p id="negocio-cnpj">CNPJ: —</p>

            </div>

            <a class="negocio__acao" href="#">Ver informações</a>
        </section>

        <section class="obrigacoes">
            <header class="secao">
                <h2>Suas obrigações</h2>

                <a href="../Obrigações/index.html">Ver todos</a>
            </header>

            <div class="obrigacoes__lista" id="lista-obrigacoes">
                <p id="obrigacoes-carregando">Carregando obrigações...</p>
            </div>
        </section>

        <section class="guia">
            <h2>Guia do MEI</h2>

            <div class="guia__grade">
                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Predio.svg" alt="">

                    <span>Como abrir um MEI</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Recibo.svg" alt="">

                    <span>Como emitir o DAS</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Martelo.svg" alt="">

                    <span>Direitos e obrigações</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Documentos.svg" alt="">

                    <span>Documentos importantes</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Calendario.svg" alt="">

                    <span>Declaração anual</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">

                <a class="atalho" href="../Guias/index.html">
                    <img class="atalho__icone" src="../Assets/Lupa.svg" alt="">

                    <span>Dúvidas frequentes</span>

                    <img class="atalho__seta" src="../Assets/Chevron.svg" alt="">
                </a>
            </div>
        </section>

  <!-- Navbar global (rodapé) -->
  <div id="navbar-global"></div>
