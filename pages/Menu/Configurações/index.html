<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../../../shared/scripts/api.js" data-protegida></script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../../shared/components/NavBarGlobal/style.css" />
  <link rel="stylesheet" href="../../../shared/styles/transicoes.css" />
  <link rel="stylesheet" href="../../../shared/components/Menu/style.css" />
</head>
<body>

  <header>
    <nav class="nav-icon">
      <span class="voltar" role="button" tabindex="0" data-abrir-menu aria-label="Abrir menu">«</span>
      <h1>Configurações</h1>
    </nav>
  </header>

  <main>

    
    <h2 class="section-title">Conta</h2>
    <div class="grupo">
      <div class="item-perfil">
        <div class="avatar">
          <img src="../Configurações/Assets/Generic avatar.png" alt="Perfil" />
        </div>
        <div class="item-info">
          <span class="item-titulo">Meu perfil</span>
          <span class="item-subtitulo">Ver e editar seus dados</span>
        </div>
        <span class="seta">›</span>
      </div>
    </div>

    
    <h2 class="section-title">Preferência</h2>
    <div class="grupo">
      <div class="item">
        <img src="../Configurações/Assets/Bell.png" alt="Notificações" class="item-icon" />
        <span class="item-titulo">Notificações</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Configurações/Assets/Moon.png" alt="Aparência" class="item-icon" />
        <span class="item-titulo">Aparência</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Configurações/Assets/Globe.png" alt="Idioma" class="item-icon" />
        <span class="item-titulo">Idioma</span>
        <span class="seta">›</span>
      </div>
    </div>

    
    <h2 class="section-title">Segurança</h2>
    <div class="grupo">
      <div class="item">
        <img src="../Configurações/Assets/Lock.png" alt="Senha e Segurança" class="item-icon" />
        <span class="item-titulo">Senha e Segurança</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Configurações/Assets/Shield.png" alt="Privacidade" class="item-icon" />
        <span class="item-titulo">Privacidade</span>  
        <span class="seta">›</span>
      </div>
    </div>

  
    <h2 class="section-title">Suporte</h2>
    <div class="grupo">
      <div class="item">
        <img src="../Configurações/Assets/Help circle.png" alt="Ajuda e Suporte" class="item-icon" />
        <span class="item-titulo">Ajuda e Suporte</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Configurações/Assets/Alert circle.png" alt="Sobre o aplicativo" class="item-icon" />
        <span class="item-titulo">Sobre o aplicativo</span>
        <span class="seta">›</span>
      </div>
    </div>

  </main>


  <!-- Navbar global (rodapé) -->
  <div id="navbar-global"></div>
  <script src="../../../shared/components/NavBarGlobal/script.js"></script>

  <!-- Menu lateral (abre pelo « do topo) -->
  <script src="../../../shared/components/Menu/script.js"></script>
</body>
</html>
